<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Protezione del browser: il sito può caricare script solo dai suoi file, e contenuti esterni solo da
     Adobe Fonts (caratteri), Vimeo e YouTube (video), Formspree (modulo). Se aggiungi un nuovo servizio esterno va aggiunto qui. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://use.typekit.net https://p.typekit.net; font-src 'self' https://use.typekit.net; img-src 'self' data: https://p.typekit.net; media-src 'self'; frame-src https://player.vimeo.com https://www.youtube-nocookie.com; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'">
<title>Pagina non trovata — Emanuele Lombardi</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://use.typekit.net/gld1ckd.css">
<link rel="preload" href="/assets/fonts/eb-garamond-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<!-- Pagina 404: Netlify la mostra da sola quando qualcuno apre un indirizzo che non esiste.
     I percorsi iniziano con "/" perché la pagina può comparire a qualsiasi indirizzo. -->
<main class="not-found">
  <p class="accent">Questa pagina</p>
  <h1>NON C’È</h1>
  <a class="button" href="/">Torna al sito<svg viewBox="0 0 13 10" aria-hidden="true"><path d="M.5 5H12M8 .8L12.2 5 8 9.2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></a>
</main>
</body>
</html>
